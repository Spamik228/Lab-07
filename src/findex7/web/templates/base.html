<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Findex Search Engine{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body class="h-full flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="font-mono font-bold text-xl tracking-tight text-cyan-400 flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-cyan-400 rounded-sm"></span>
                findex<span class="text-slate-500 text-xs font-normal">v1.0</span>
            </a>
            <nav class="flex items-center gap-6 text-sm text-slate-400 font-mono">
                <a href="/stats" class="hover:text-cyan-400 transition-colors">/stats</a>
                <a href="/health" target="_blank" class="hover:text-cyan-400 transition-colors">/health</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600 font-mono">
        Findex Search Engine &bull; High-Performance Information Retrieval
    </footer>
</body>
</html>
