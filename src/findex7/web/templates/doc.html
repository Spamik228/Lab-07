{% extends "base.html" %}

{% block title %}{{ document.title }} - Findex{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <a href="/" class="inline-flex items-center gap-2 text-xs font-mono text-slate-400 hover:text-cyan-400 transition-colors">
        &larr; Back to search
    </a>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
        <div class="space-y-1">
            <span class="text-xs font-mono text-cyan-500 uppercase tracking-wider">Document View</span>
            <h1 class="text-2xl font-bold text-white">{{ document.title }}</h1>
            <div class="text-xs font-mono text-slate-500">ID: {{ doc_id }}</div>
        </div>
        <hr class="border-slate-800">
        <div class="prose prose-invert max-w-none text-slate-300 text-sm leading-relaxed whitespace-pre-wrap font-sans">
            {{ document.content }}
        </div>
    </div>
</div>
{% endblock %}
